name: Audit

# Checks the dependencies against the RustSec advisory database.
on:
  # No path filter here: a required check has to report on every pull request.
  pull_request:
  push:
    branches: [ main ]
    paths: [ "**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml" ]
  # New advisories appear without changes to this repository.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Scheduled runs on main open an issue per advisory.
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
